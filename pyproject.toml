[project]
name = "your-first-light"
version = "1.0.0"
description = "Post your birthday. Discover your cosmic reach."
requires-python = ">=3.13"
# Exact versions live in uv.lock. numpy, pydantic, pyerfa and Starlette
# come in through astropy and fastapi too, but the app imports them
# directly.
dependencies = [
    "fastapi>=0.162.5,<0.163.0",
    "uvicorn>=0.54.0,<0.55.0",
    "astropy>=8.0.2,<8.1.0",
    "numpy>=2.5.1,<3",
    "pydantic>=2.7,<3",
    "pyerfa>=2.0.1",
    "starlette>=1.10.0,<2",
]

[dependency-groups]
dev = [
    # Starlette's TestClient runs on httpx2.
    "httpx2>=2.12",
    "pytest>=8.0",
    "ruff>=0.15",
    "mypy>=1.14",
]
# Only tools/update_data.py needs it, to query the upstream catalogues.
catalogue = [
    "astroquery>=0.4.11",
]

[tool.uv]
# The app runs from src/ beside data/ (the image, uvicorn --app-dir src,
# pytest's pythonpath) and is never installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# src for the app, the root for tools/, which the updater tests import.
pythonpath = ["src", "."]
# Test files in different folders may share a name.
addopts = ["--import-mode=importlib", "--strict-markers"]
filterwarnings = [
    "ignore::erfa.ErfaWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
# Beyond the style and import rules: likely bugs (B), docstrings (D),
# dates and times with no zone (DTZ), ruff's own checks (RUF) and
# idioms an older Python needed (UP).
select = ["B", "D", "DTZ", "E", "F", "I", "RUF", "UP", "W"]
# A class docstring describes what its constructor takes.
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name says what it checks; it has a docstring only where
# the name cannot.
"tests/**" = ["D1"]
# A calendar date is parsed there, not an instant, so there is no
# zone to give.
"src/first_light/web/date_formats.py" = ["DTZ007"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tools"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# astropy, astroquery and pyerfa ship no type stubs or py.typed marker.
module = ["astropy.*", "astroquery.*", "erfa"]
ignore_missing_imports = true
