# Monthly data refresh: regenerates the star and eclipse catalogues from
# their upstream sources, validates them, runs the format, lint, type and
# test checks against the new data and opens a pull request when
# anything changed. Nothing reaches main until someone has reviewed and
# merged it.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" (Settings, Actions, General, Workflow permissions) must be on,
# or the last step fails after pushing the branch. On a pull request
# opened with the workflow's own token, GitHub holds the Tests workflow
# until someone with write access approves the run.
name: Update data

on:
  schedule:
    # The 3rd of each month at 04:17 UTC.
    - cron: "17 4 3 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    # A run takes about two minutes, and retries against a host that
    # refuses add up to eight more. A host that accepts and then stalls,
    # or a Gaia job that stays queued, is cut off by this limit.
    timeout-minutes: 30
    permissions:
      # Push the data/refresh branch.
      contents: write
      # Open or update its pull request.
      pull-requests: write
    steps:
      # The token is not left in the checkout, where the updater's
      # dependencies could read it; the pull request step brings its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync --locked --group catalogue

      # Writes a summary for the pull request: entry counts, known
      # exoplanets, the star names within 30 light-years that were added,
      # removed or renamed, and the spectral types and planet counts there
      # that changed.
      - name: Regenerate data catalogues
        env:
          DATA_SUMMARY_PATH: ${{ runner.temp }}/data-summary.md
        run: uv run python tools/update_data.py

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run tests against the refreshed data
        run: uv run pytest -q

      # Opens or updates the pull request only when data/ changed.
      - name: Open pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: data/
          branch: data/refresh
          delete-branch: true
          commit-message: Refresh data catalogues
          title: Refresh data catalogues
          body-path: ${{ runner.temp }}/data-summary.md
